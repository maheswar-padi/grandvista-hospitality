# Load balancer in front of the two API gateway instances: round robin with passive health checks.
# A gateway that refuses connections or times out is skipped for 10 s and the request is sent to the other
# one (nginx never re-sends a non-idempotent request such as POST once it reached a gateway).
resolver 127.0.0.11 valid=5s ipv6=off;   # Docker's DNS: re-resolve names when a gateway restarts with a new IP

upstream api_gateways {
    zone api_gateways 64k;
    server api-gateway-1:8080 resolve max_fails=1 fail_timeout=10s;
    server api-gateway-2:8080 resolve max_fails=1 fail_timeout=10s;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 6m;

    location = /lb-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://api_gateways;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Clients reach this proxy directly: overwrite, so the gateway's per-client rate limit sees the real peer.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 2;
    }
}
