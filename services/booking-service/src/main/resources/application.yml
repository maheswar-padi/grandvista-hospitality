server:
  port: ${PORT:8083}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

spring:
  application:
    name: booking-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5435/grandvista_booking}
    username: ${DB_USERNAME:grandvista_booking}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:15}
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 50
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    connection-timeout: 5s
    listener:
      simple:
        # Failed messages are retried in the consumer with exponential backoff, then rejected without requeue,
        # which routes them to the queue's dead-letter queue (booking.payment-events.dlq).
        default-requeue-rejected: false
        prefetch: 10
        retry:
          enabled: true
          max-attempts: 6
          initial-interval: 1s
          multiplier: 2
          max-interval: 15s

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    healthcheck:
      enabled: true
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5
    # a crashed instance (no deregistration) is evicted after 15 s
    lease-expiration-duration-in-seconds: 15

gv:
  security:
    jwt:
      issuer: ${GV_JWT_ISSUER:grandvista-auth}
      jwk-set-uri: ${GV_JWKS_URI:http://localhost:8081/oauth2/jwks}
  service-auth:
    token-uri: ${GV_SERVICE_TOKEN_URI:http://auth-service/internal/v1/service-tokens}
    client-id: booking-service
    client-secret: ${BOOKING_SERVICE_CLIENT_SECRET:}
  booking:
    hotel-zone: ${GV_HOTEL_ZONE:Asia/Kolkata}
    max-nights: 30
    cancellation:
      full-refund-days: 7
      partial-refund-days: 2
      partial-refund-percent: 50
    events:
      publish-enabled: ${GV_EVENTS_PUBLISH_ENABLED:true}
      consume-enabled: ${GV_EVENTS_CONSUME_ENABLED:true}
      relay-interval: 1s
      max-attempts: 25
      max-backoff: 5m
    recovery:
      interval: 30s
      stuck-threshold: 2m
      expiry-grace: 30s
    rooms:
      base-url: ${GV_ROOM_SERVICE_URL:http://room-service}
      connect-timeout: 2s
      read-timeout: 5s
    payments:
      base-url: ${GV_PAYMENT_SERVICE_URL:http://payment-service}
      connect-timeout: 2s
      read-timeout: 8s

spring.cloud.loadbalancer.cache.ttl: 5s

# Resilience4j policies for calls to room-service and payment-service (see client/Resilience.java).
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
        record-failure-predicate: com.grandvista.booking.client.TransientFailure
        # A circuit state is visible in metrics; it must not make this instance DOWN in Eureka.
        register-health-indicator: false
    instances:
      room-service:
        base-config: default
      payment-service:
        base-config: default
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        exponential-max-wait-duration: 2s
        enable-randomized-wait: true
        randomized-wait-factor: 0.2
        retry-exception-predicate: com.grandvista.booking.client.TransientFailure
    instances:
      room-service:
        base-config: default
      payment-service:
        base-config: default

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}

management:
  health:
    # The Eureka indicator reports the status Eureka currently holds for this instance. Feeding it back
    # into the health that eureka.client.healthcheck publishes creates an UP/DOWN loop, so it is excluded;
    # Eureka then reflects real dependencies (database, disk).
    eureka:
      enabled: false
    # Bookings keep working while the broker is down (events wait in the outbox, the recovery job reconciles
    # payments), so the broker must not mark this instance DOWN in Eureka.
    rabbit:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-components: always
      show-details: never

info:
  service:
    name: ${spring.application.name}
    description: Reservations and booking saga orchestration

logging:
  pattern:
    console: "%d{ISO8601} %5p [${spring.application.name}] [cid=%X{correlationId:-}] %logger{36} - %m%n"

---
spring:
  config:
    activate:
      on-profile: prod
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
