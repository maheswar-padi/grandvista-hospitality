server:
  port: ${PORT:8083}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

spring:
  application:
    name: booking-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/grandvista_booking}
    username: ${DB_USERNAME:grandvista_booking}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:15}
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 50
  flyway:
    enabled: true

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    healthcheck:
      enabled: true
    registry-fetch-interval-seconds: 10
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

gv:
  security:
    jwt:
      issuer: ${GV_JWT_ISSUER:grandvista-auth}
      jwk-set-uri: ${GV_JWKS_URI:http://localhost:8081/oauth2/jwks}
  service-auth:
    token-uri: ${GV_SERVICE_TOKEN_URI:http://auth-service/internal/v1/service-tokens}
    client-id: booking-service
    client-secret: ${BOOKING_SERVICE_CLIENT_SECRET:}
  booking:
    hotel-zone: ${GV_HOTEL_ZONE:Asia/Kolkata}
    max-nights: 30
    cancellation:
      full-refund-days: 7
      partial-refund-days: 2
      partial-refund-percent: 50
    recovery:
      interval: 30s
      stuck-threshold: 2m
      expiry-grace: 30s
    rooms:
      base-url: ${GV_ROOM_SERVICE_URL:http://room-service}
      connect-timeout: 2s
      read-timeout: 5s
    payments:
      base-url: ${GV_PAYMENT_SERVICE_URL:http://payment-service}
      connect-timeout: 2s
      read-timeout: 8s

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}

management:
  health:
    # The Eureka indicator reports the status Eureka currently holds for this instance. Feeding it back
    # into the health that eureka.client.healthcheck publishes creates an UP/DOWN loop, so it is excluded;
    # Eureka then reflects real dependencies (database, disk).
    eureka:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-components: always
      show-details: never

info:
  service:
    name: ${spring.application.name}
    description: Reservations and booking saga orchestration

logging:
  pattern:
    console: "%d{ISO8601} %5p [${spring.application.name}] [cid=%X{correlationId:-}] %logger{36} - %m%n"

---
spring:
  config:
    activate:
      on-profile: prod
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
