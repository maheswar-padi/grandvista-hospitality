server:
  port: ${PORT:8084}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

spring:
  application:
    name: payment-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5436/grandvista_payment}
    username: ${DB_USERNAME:grandvista_payment}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    healthcheck:
      enabled: true
    registry-fetch-interval-seconds: 10
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

gv:
  security:
    jwt:
      issuer: ${GV_JWT_ISSUER:grandvista-auth}
      jwk-set-uri: ${GV_JWKS_URI:http://localhost:8081/oauth2/jwks}
  service-auth:
    token-uri: ${GV_SERVICE_TOKEN_URI:http://auth-service/internal/v1/service-tokens}
    client-id: payment-service
    client-secret: ${PAYMENT_SERVICE_CLIENT_SECRET:}
  payment:
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET:}
    webhook-tolerance: 5m
    outbox:
      booking-service-url: ${GV_BOOKING_SERVICE_URL:http://booking-service}
      relay-interval: 2s
      max-attempts: 25
      max-backoff: 5m
    reconciliation:
      interval: 20s
      pending-threshold: 45s
    simulator:
      enabled: true
      webhook-url: ${GV_SIMULATOR_WEBHOOK_URL:http://localhost:8084/api/v1/payments/webhooks/simulated}
      webhook-delay: 3s

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}

management:
  health:
    # The Eureka indicator reports the status Eureka currently holds for this instance. Feeding it back
    # into the health that eureka.client.healthcheck publishes creates an UP/DOWN loop, so it is excluded;
    # Eureka then reflects real dependencies (database, disk).
    eureka:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-components: always
      show-details: never

info:
  service:
    name: ${spring.application.name}
    description: Payments (simulated provider), refunds and webhooks

logging:
  pattern:
    console: "%d{ISO8601} %5p [${spring.application.name}] [cid=%X{correlationId:-}] %logger{36} - %m%n"

---
spring:
  config:
    activate:
      on-profile: prod
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
