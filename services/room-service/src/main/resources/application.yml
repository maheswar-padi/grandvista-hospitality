server:
  port: ${PORT:8082}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

spring:
  application:
    name: room-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/grandvista_room}
    username: ${DB_USERNAME:grandvista_room}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:15}
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 50
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    healthcheck:
      enabled: true
    registry-fetch-interval-seconds: 10
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5
    # a crashed instance (no deregistration) is evicted after 15 s
    lease-expiration-duration-in-seconds: 15

gv:
  security:
    jwt:
      issuer: ${GV_JWT_ISSUER:grandvista-auth}
      jwk-set-uri: ${GV_JWKS_URI:http://localhost:8081/oauth2/jwks}
  hotel:
    zone-id: ${GV_HOTEL_ZONE:Asia/Kolkata}
    max-nights: 30
    max-advance-days: 365
    hold-ttl: ${GV_HOLD_TTL:15m}
    quote-validity: 15m
  inventory:
    hold-sweep-interval: 30s
    reconciliation:
      enabled: ${GV_RECONCILIATION_ENABLED:true}
      interval: ${GV_RECONCILIATION_INTERVAL:10m}
      initial-delay: ${GV_RECONCILIATION_INITIAL_DELAY:2m}
      grace: 2m
      booking-service-url: http://booking-service
      http-timeout: 5s
  service-auth:
    token-uri: ${GV_SERVICE_TOKEN_URI:http://auth-service/internal/v1/service-tokens}
    client-id: room-service
    client-secret: ${ROOM_SERVICE_CLIENT_SECRET:}
  media:
    local-root: ${GV_MEDIA_ROOT:./var/media}
    max-image-size: 5MB
  demo:
    seed-enabled: ${GV_DEMO_SEED_ENABLED:true}

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}

management:
  health:
    # The Eureka indicator reports the status Eureka currently holds for this instance. Feeding it back
    # into the health that eureka.client.healthcheck publishes creates an UP/DOWN loop, so it is excluded;
    # Eureka then reflects real dependencies (database, disk).
    eureka:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-components: always
      show-details: never

info:
  service:
    name: ${spring.application.name}
    description: Rooms, availability, pricing and inventory

logging:
  pattern:
    console: "%d{ISO8601} %5p [${spring.application.name}] [cid=%X{correlationId:-}] %logger{36} - %m%n"

---
spring:
  config:
    activate:
      on-profile: prod
gv:
  demo:
    seed-enabled: ${GV_DEMO_SEED_ENABLED:false}
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
