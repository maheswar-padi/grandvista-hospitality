server:
  port: ${PORT:8085}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

spring:
  application:
    name: notification-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5437/grandvista_notification}
    username: ${DB_USERNAME:grandvista_notification}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:6}
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    connection-timeout: 5s
    listener:
      simple:
        # Retried in the consumer with exponential backoff (≈ 1+2+4+8+15 s), then rejected without requeue,
        # which dead-letters the message to notification.events.dlq.
        default-requeue-rejected: false
        prefetch: 10
        retry:
          enabled: true
          max-attempts: 6
          initial-interval: 1s
          multiplier: 2
          max-interval: 15s
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}
  thymeleaf:
    cache: true

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    healthcheck:
      enabled: true
    registry-fetch-interval-seconds: 10
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5
    # a crashed instance (no deregistration) is evicted after 15 s
    lease-expiration-duration-in-seconds: 15

gv:
  security:
    jwt:
      issuer: ${GV_JWT_ISSUER:grandvista-auth}
      jwk-set-uri: ${GV_JWKS_URI:http://localhost:8081/oauth2/jwks}
  notification:
    mail-from: ${GV_MAIL_FROM:GrandVista Hospitality <reservations@grandvista.local>}
    web-base-url: ${GV_PUBLIC_WEB_URL:http://localhost:3000}
    hotel-name: GrandVista Hospitality
    hotel-zone: ${GV_HOTEL_ZONE:Asia/Kolkata}
    consume-enabled: ${GV_EVENTS_CONSUME_ENABLED:true}
    consumers: 2

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}

management:
  health:
    # See the other services: the Eureka indicator must not feed back into the health published to Eureka.
    eureka:
      enabled: false
    # The broker and the SMTP server are this service's real dependencies, so they stay in its health.
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-components: always
      show-details: never

info:
  service:
    name: ${spring.application.name}
    description: E-mail notifications from booking and payment events

logging:
  pattern:
    console: "%d{ISO8601} %5p [${spring.application.name}] [cid=%X{correlationId:-}] %logger{36} - %m%n"

---
spring:
  config:
    activate:
      on-profile: prod
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
