<!DOCTYPE html>
<!-- Shared e-mail frame. Inline styles only: most e-mail clients ignore <style> blocks. -->
<html xmlns:th="http://www.thymeleaf.org" lang="en" th:fragment="frame(content)">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${headline}">GrandVista</title></head>
<body style="margin:0;padding:0;background:#f4f1ec;font-family:Helvetica,Arial,sans-serif;color:#2b2a28;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f1ec;padding:24px 0;">
  <tr><td align="center">
    <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background:#ffffff;border-radius:8px;overflow:hidden;">
      <tr><td style="background:#1f3a34;padding:20px 28px;">
        <span style="font-family:Georgia,'Times New Roman',serif;font-size:22px;color:#f4f1ec;letter-spacing:.5px;" th:text="${hotelName}">GrandVista Hospitality</span>
      </td></tr>
      <tr><td style="padding:28px;">
        <h1 style="font-family:Georgia,'Times New Roman',serif;font-weight:normal;font-size:24px;margin:0 0 12px;" th:text="${headline}">Headline</h1>
        <p style="margin:0 0 16px;">Dear <span th:text="${guestName}">Guest</span>,</p>
        <div th:replace="${content}"></div>
        <p style="margin:24px 0 0;font-size:13px;color:#6b6762;">Booking reference <strong th:text="${reference}">GV-XXXXXX</strong></p>
      </td></tr>
      <tr><td style="padding:16px 28px;background:#faf8f5;font-size:12px;color:#8a857e;">
        This e-mail was sent by <span th:text="${hotelName}">GrandVista Hospitality</span> about your booking. Please do not reply.
      </td></tr>
    </table>
  </td></tr>
</table>
</body>
</html>
