<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" th:replace="~{email/layout :: frame(~{::content})}">
<body>
<div th:fragment="content">
  <p style="margin:0 0 12px;">We have received your payment. This is your receipt.</p>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border:1px solid #e7e2da;border-radius:6px;margin:8px 0 16px;font-size:14px;">
    <tr><td style="padding:10px 14px;color:#6b6762;width:40%;">Amount paid</td><td style="padding:10px 14px;"><strong th:text="${paid}">₹10,584.00</strong></td></tr>
    <tr><td style="padding:10px 14px;color:#6b6762;border-top:1px solid #f0ece6;">Payment ID</td><td style="padding:10px 14px;border-top:1px solid #f0ece6;font-family:monospace;font-size:12px;" th:text="${paymentId}">id</td></tr>
    <tr th:if="${occurredAt}"><td style="padding:10px 14px;color:#6b6762;border-top:1px solid #f0ece6;">Date</td><td style="padding:10px 14px;border-top:1px solid #f0ece6;" th:text="${occurredAt}">date</td></tr>
    <tr th:if="${roomName}"><td style="padding:10px 14px;color:#6b6762;border-top:1px solid #f0ece6;">For</td>
      <td style="padding:10px 14px;border-top:1px solid #f0ece6;"><span th:text="${roomName}">Room</span>, <span th:text="${checkIn}">in</span> – <span th:text="${checkOut}">out</span></td></tr>
  </table>
  <p th:if="${simulated}" style="margin:0 0 16px;padding:10px 14px;background:#fff6e0;border-radius:6px;font-size:13px;">
    This was a <strong>simulated payment</strong> (test mode). No real money was charged.</p>
  <a th:href="${manageUrl}" style="display:inline-block;background:#1f3a34;color:#ffffff;text-decoration:none;padding:12px 20px;border-radius:6px;">View booking</a>
</div>
</body>
</html>
