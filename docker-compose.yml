# GrandVista Hospitality — local / demonstration stack.
#   ./scripts/init-env.sh        # once: generates .env and the JWT key pair (never committed)
#   docker compose up -d --build
# Public entry points: http://localhost:3000 (web app) and http://localhost:8080 (API gateway).

x-java-service: &java-service
  restart: unless-stopped
  networks: [grandvista]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }
  deploy:
    resources:
      limits:
        memory: 448m

x-rabbit-env: &rabbit-env
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}

x-eureka-env: &eureka-env
  EUREKA_URL: http://${EUREKA_USERNAME}:${EUREKA_PASSWORD}@discovery-server:8761/eureka
  GV_JWKS_URI: http://auth-service:8081/oauth2/jwks
  GV_HOTEL_ZONE: ${GV_HOTEL_ZONE:-Asia/Kolkata}
  API_DOCS_ENABLED: ${API_DOCS_ENABLED:-true}
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}

x-postgres-env: &postgres-env
  # Container superuser: used only by the init script to create the service's own non-superuser role.
  POSTGRES_USER: ${POSTGRES_ADMIN_USER:-grandvista_admin}
  POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?run ./scripts/init-env.sh first}
  POSTGRES_DB: postgres

x-postgres-service: &postgres-service
  image: postgres:16-alpine
  restart: unless-stopped
  networks: [grandvista]
  # Ports are bound to loopback only, for local tools (psql, IDE).
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $${SERVICE_USER} -d $${SERVICE_DB} -h 127.0.0.1"]
    interval: 5s
    timeout: 5s
    retries: 20
  deploy:
    resources:
      limits:
        memory: 192m

services:
  # ---- Database per service: four independent PostgreSQL servers, each with its own credentials and volume ----
  auth-db:
    <<: *postgres-service
    environment:
      <<: *postgres-env
      SERVICE_DB: grandvista_auth
      SERVICE_USER: grandvista_auth
      SERVICE_PASSWORD: ${AUTH_DB_PASSWORD:?missing}
    volumes:
      - auth-db-data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports: ["127.0.0.1:${AUTH_DB_HOST_PORT:-5433}:5432"]

  room-db:
    <<: *postgres-service
    environment:
      <<: *postgres-env
      SERVICE_DB: grandvista_room
      SERVICE_USER: grandvista_room
      SERVICE_PASSWORD: ${ROOM_DB_PASSWORD:?missing}
    volumes:
      - room-db-data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports: ["127.0.0.1:${ROOM_DB_HOST_PORT:-5434}:5432"]

  booking-db:
    <<: *postgres-service
    environment:
      <<: *postgres-env
      SERVICE_DB: grandvista_booking
      SERVICE_USER: grandvista_booking
      SERVICE_PASSWORD: ${BOOKING_DB_PASSWORD:?missing}
    volumes:
      - booking-db-data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports: ["127.0.0.1:${BOOKING_DB_HOST_PORT:-5435}:5432"]

  payment-db:
    <<: *postgres-service
    environment:
      <<: *postgres-env
      SERVICE_DB: grandvista_payment
      SERVICE_USER: grandvista_payment
      SERVICE_PASSWORD: ${PAYMENT_DB_PASSWORD:?missing}
    volumes:
      - payment-db-data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports: ["127.0.0.1:${PAYMENT_DB_HOST_PORT:-5436}:5432"]

  notification-db:
    <<: *postgres-service
    environment:
      <<: *postgres-env
      SERVICE_DB: grandvista_notification
      SERVICE_USER: grandvista_notification
      SERVICE_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?missing}
    volumes:
      - notification-db-data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports: ["127.0.0.1:${NOTIFICATION_DB_HOST_PORT:-5437}:5432"]

  # ---- Messaging and e-mail ----
  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    hostname: rabbitmq
    restart: unless-stopped
    networks: [grandvista]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:?missing}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?missing}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./infrastructure/docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/90-grandvista.conf:ro
    # AMQP and the management UI, loopback only.
    ports:
      - "127.0.0.1:${RABBITMQ_HOST_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_UI_HOST_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    deploy: { resources: { limits: { memory: 320m } } }

  # Local SMTP server that captures every e-mail; nothing is delivered to real mailboxes.
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    networks: [grandvista]
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports: ["127.0.0.1:${MAILPIT_UI_HOST_PORT:-8025}:8025"]
    deploy: { resources: { limits: { memory: 64m } } }

  discovery-server:
    <<: *java-service
    build: { context: ., dockerfile: services/discovery-server/Dockerfile }
    image: grandvista/discovery-server:1.0.0
    environment:
      EUREKA_USERNAME: ${EUREKA_USERNAME:?missing}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD:?missing}
      EUREKA_HOSTNAME: discovery-server
      EUREKA_SELF_PRESERVATION: "false"
    # Dashboard is protected by HTTP Basic; published on loopback only.
    ports: ["127.0.0.1:8761:8761"]
    deploy: { resources: { limits: { memory: 384m } } }

  auth-service:
    <<: *java-service
    build: { context: ., dockerfile: services/auth-service/Dockerfile }
    image: grandvista/auth-service:1.0.0
    depends_on:
      auth-db: { condition: service_healthy }
      discovery-server: { condition: service_healthy }
    environment:
      <<: *eureka-env
      DB_URL: jdbc:postgresql://auth-db:5432/grandvista_auth
      DB_USERNAME: grandvista_auth
      DB_PASSWORD: ${AUTH_DB_PASSWORD}
      GV_JWT_PRIVATE_KEY_PATH: /run/secrets/jwt-private.pem
      GV_JWT_PUBLIC_KEY_PATH: /run/secrets/jwt-public.pem
      GV_JWT_ALLOW_EPHEMERAL_KEY: "false"
      GV_COOKIE_SECURE: ${GV_COOKIE_SECURE:-true}
      GV_BOOTSTRAP_ADMIN_EMAIL: ${GV_BOOTSTRAP_ADMIN_EMAIL:-}
      GV_BOOTSTRAP_ADMIN_PASSWORD: ${GV_BOOTSTRAP_ADMIN_PASSWORD:-}
      GV_DEMO_SEED_ENABLED: ${GV_DEMO_SEED_ENABLED:-true}
      GV_DEMO_CUSTOMER_EMAIL: ${GV_DEMO_CUSTOMER_EMAIL:-guest@grandvista.local}
      GV_DEMO_CUSTOMER_PASSWORD: ${GV_DEMO_CUSTOMER_PASSWORD:-}
      GV_DEMO_STAFF_EMAIL: ${GV_DEMO_STAFF_EMAIL:-staff@grandvista.local}
      GV_DEMO_STAFF_PASSWORD: ${GV_DEMO_STAFF_PASSWORD:-}
      BOOKING_SERVICE_CLIENT_SECRET: ${BOOKING_SERVICE_CLIENT_SECRET:?missing}
      PAYMENT_SERVICE_CLIENT_SECRET: ${PAYMENT_SERVICE_CLIENT_SECRET:?missing}
    volumes:
      - ./infrastructure/secrets/jwt-private.pem:/run/secrets/jwt-private.pem:ro
      - ./infrastructure/secrets/jwt-public.pem:/run/secrets/jwt-public.pem:ro

  room-service:
    <<: *java-service
    build: { context: ., dockerfile: services/room-service/Dockerfile }
    image: grandvista/room-service:1.0.0
    depends_on:
      room-db: { condition: service_healthy }
      discovery-server: { condition: service_healthy }
      auth-service: { condition: service_healthy }
    environment:
      <<: *eureka-env
      DB_URL: jdbc:postgresql://room-db:5432/grandvista_room
      DB_USERNAME: grandvista_room
      DB_PASSWORD: ${ROOM_DB_PASSWORD}
      GV_MEDIA_ROOT: /app/var/media
      GV_DEMO_SEED_ENABLED: ${GV_DEMO_SEED_ENABLED:-true}
      GV_HOLD_TTL: ${GV_HOLD_TTL:-15m}
    volumes:
      - room-media:/app/var/media

  payment-service:
    <<: *java-service
    build: { context: ., dockerfile: services/payment-service/Dockerfile }
    image: grandvista/payment-service:1.0.0
    depends_on:
      payment-db: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      discovery-server: { condition: service_healthy }
      auth-service: { condition: service_healthy }
    environment:
      <<: [*eureka-env, *rabbit-env]
      DB_URL: jdbc:postgresql://payment-db:5432/grandvista_payment
      DB_USERNAME: grandvista_payment
      DB_PASSWORD: ${PAYMENT_DB_PASSWORD}
      PAYMENT_SERVICE_CLIENT_SECRET: ${PAYMENT_SERVICE_CLIENT_SECRET}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:?missing}
      GV_SIMULATOR_WEBHOOK_URL: http://payment-service:8084/api/v1/payments/webhooks/simulated

  booking-service:
    <<: *java-service
    build: { context: ., dockerfile: services/booking-service/Dockerfile }
    image: grandvista/booking-service:1.0.0
    depends_on:
      booking-db: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      discovery-server: { condition: service_healthy }
      auth-service: { condition: service_healthy }
      room-service: { condition: service_healthy }
      payment-service: { condition: service_healthy }
    environment:
      <<: [*eureka-env, *rabbit-env]
      DB_URL: jdbc:postgresql://booking-db:5432/grandvista_booking
      DB_USERNAME: grandvista_booking
      DB_PASSWORD: ${BOOKING_DB_PASSWORD}
      BOOKING_SERVICE_CLIENT_SECRET: ${BOOKING_SERVICE_CLIENT_SECRET}

  notification-service:
    <<: *java-service
    build: { context: ., dockerfile: services/notification-service/Dockerfile }
    image: grandvista/notification-service:1.0.0
    depends_on:
      notification-db: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      mailpit: { condition: service_healthy }
      discovery-server: { condition: service_healthy }
      auth-service: { condition: service_healthy }
    environment:
      <<: [*eureka-env, *rabbit-env]
      DB_URL: jdbc:postgresql://notification-db:5432/grandvista_notification
      DB_USERNAME: grandvista_notification
      DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      GV_MAIL_FROM: ${GV_MAIL_FROM:-GrandVista Hospitality <reservations@grandvista.local>}
      GV_PUBLIC_WEB_URL: ${GV_PUBLIC_WEB_URL:-http://localhost:3000}

  api-gateway:
    <<: *java-service
    build: { context: ., dockerfile: services/api-gateway/Dockerfile }
    image: grandvista/api-gateway:1.0.0
    depends_on:
      discovery-server: { condition: service_healthy }
      auth-service: { condition: service_healthy }
    environment:
      EUREKA_URL: http://${EUREKA_USERNAME}:${EUREKA_PASSWORD}@discovery-server:8761/eureka
      GV_JWKS_URI: http://auth-service:8081/oauth2/jwks
      GV_CORS_ALLOWED_ORIGINS: ${GV_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      GV_TRUST_FORWARDED_FOR: "true"
      GV_API_RATE_LIMIT: ${GV_API_RATE_LIMIT:-300}
      GV_AUTH_RATE_LIMIT: ${GV_AUTH_RATE_LIMIT:-10}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-true}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
    ports: ["${GATEWAY_HOST_PORT:-8080}:8080"]

  frontend:
    build: { context: ./frontend }
    image: grandvista/frontend:1.0.0
    restart: unless-stopped
    networks: [grandvista]
    depends_on:
      api-gateway: { condition: service_healthy }
    ports: ["${FRONTEND_HOST_PORT:-3000}:8080"]
    deploy: { resources: { limits: { memory: 64m } } }

networks:
  grandvista:
    name: grandvista

volumes:
  auth-db-data:
    name: grandvista-auth-db-data
  room-db-data:
    name: grandvista-room-db-data
  booking-db-data:
    name: grandvista-booking-db-data
  payment-db-data:
    name: grandvista-payment-db-data
  notification-db-data:
    name: grandvista-notification-db-data
  rabbitmq-data:
    name: grandvista-rabbitmq-data
  room-media:
    name: grandvista-room-media
