# GrandVista Hospitality — local / demonstration stack.
#   ./scripts/init-env.sh        # once: generates .env and the JWT key pair (never committed)
#   docker compose up -d --build
# Public entry points: http://localhost:3000 (web app) and http://localhost:8080 (API gateway).

x-java-service: &java-service
  restart: unless-stopped
  networks: [grandvista]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }
  deploy:
    resources:
      limits:
        memory: 512m

x-eureka-env: &eureka-env
  EUREKA_URL: http://${EUREKA_USERNAME}:${EUREKA_PASSWORD}@discovery-server:8761/eureka
  GV_JWKS_URI: http://auth-service:8081/oauth2/jwks
  GV_HOTEL_ZONE: ${GV_HOTEL_ZONE:-Asia/Kolkata}
  API_DOCS_ENABLED: ${API_DOCS_ENABLED:-true}
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks: [grandvista]
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-grandvista_admin}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?run ./scripts/init-env.sh first}
      POSTGRES_DB: postgres
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?missing}
      ROOM_DB_PASSWORD: ${ROOM_DB_PASSWORD:?missing}
      BOOKING_DB_PASSWORD: ${BOOKING_DB_PASSWORD:?missing}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?missing}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    # Bound to loopback only, for local tools (psql, IDE). Remove the mapping to keep it fully private.
    ports: ["127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 384m

  discovery-server:
    <<: *java-service
    build: { context: ., dockerfile: services/discovery-server/Dockerfile }
    image: grandvista/discovery-server:1.0.0
    environment:
      EUREKA_USERNAME: ${EUREKA_USERNAME:?missing}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD:?missing}
      EUREKA_HOSTNAME: discovery-server
      EUREKA_SELF_PRESERVATION: "false"
    # Dashboard is protected by HTTP Basic; published on loopback only.
    ports: ["127.0.0.1:8761:8761"]
    deploy: { resources: { limits: { memory: 384m } } }

  auth-service:
    <<: *java-service
    build: { context: ., dockerfile: services/auth-service/Dockerfile }
    image: grandvista/auth-service:1.0.0
    depends_on:
      postgres: { condition: service_healthy }
      discovery-server: { condition: service_healthy }
    environment:
      <<: *eureka-env
      DB_URL: jdbc:postgresql://postgres:5432/grandvista_auth
      DB_USERNAME: grandvista_auth
      DB_PASSWORD: ${AUTH_DB_PASSWORD}
      GV_JWT_PRIVATE_KEY_PATH: /run/secrets/jwt-private.pem
      GV_JWT_PUBLIC_KEY_PATH: /run/secrets/jwt-public.pem
      GV_JWT_ALLOW_EPHEMERAL_KEY: "false"
      GV_COOKIE_SECURE: ${GV_COOKIE_SECURE:-true}
      GV_BOOTSTRAP_ADMIN_EMAIL: ${GV_BOOTSTRAP_ADMIN_EMAIL:-}
      GV_BOOTSTRAP_ADMIN_PASSWORD: ${GV_BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOKING_SERVICE_CLIENT_SECRET: ${BOOKING_SERVICE_CLIENT_SECRET:?missing}
      PAYMENT_SERVICE_CLIENT_SECRET: ${PAYMENT_SERVICE_CLIENT_SECRET:?missing}
    volumes:
      - ./infrastructure/secrets/jwt-private.pem:/run/secrets/jwt-private.pem:ro
      - ./infrastructure/secrets/jwt-public.pem:/run/secrets/jwt-public.pem:ro

  room-service:
    <<: *java-service
    build: { context: ., dockerfile: services/room-service/Dockerfile }
    image: grandvista/room-service:1.0.0
    depends_on:
      postgres: { condition: service_healthy }
      discovery-server: { condition: service_healthy }
      auth-service: { condition: service_healthy }
    environment:
      <<: *eureka-env
      DB_URL: jdbc:postgresql://postgres:5432/grandvista_room
      DB_USERNAME: grandvista_room
      DB_PASSWORD: ${ROOM_DB_PASSWORD}
      GV_MEDIA_ROOT: /app/var/media
      GV_DEMO_SEED_ENABLED: ${GV_DEMO_SEED_ENABLED:-true}
      GV_HOLD_TTL: ${GV_HOLD_TTL:-15m}
    volumes:
      - room-media:/app/var/media

  payment-service:
    <<: *java-service
    build: { context: ., dockerfile: services/payment-service/Dockerfile }
    image: grandvista/payment-service:1.0.0
    depends_on:
      postgres: { condition: service_healthy }
      discovery-server: { condition: service_healthy }
      auth-service: { condition: service_healthy }
    environment:
      <<: *eureka-env
      DB_URL: jdbc:postgresql://postgres:5432/grandvista_payment
      DB_USERNAME: grandvista_payment
      DB_PASSWORD: ${PAYMENT_DB_PASSWORD}
      PAYMENT_SERVICE_CLIENT_SECRET: ${PAYMENT_SERVICE_CLIENT_SECRET}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:?missing}
      GV_SIMULATOR_WEBHOOK_URL: http://payment-service:8084/api/v1/payments/webhooks/simulated

  booking-service:
    <<: *java-service
    build: { context: ., dockerfile: services/booking-service/Dockerfile }
    image: grandvista/booking-service:1.0.0
    depends_on:
      postgres: { condition: service_healthy }
      discovery-server: { condition: service_healthy }
      auth-service: { condition: service_healthy }
      room-service: { condition: service_healthy }
      payment-service: { condition: service_healthy }
    environment:
      <<: *eureka-env
      DB_URL: jdbc:postgresql://postgres:5432/grandvista_booking
      DB_USERNAME: grandvista_booking
      DB_PASSWORD: ${BOOKING_DB_PASSWORD}
      BOOKING_SERVICE_CLIENT_SECRET: ${BOOKING_SERVICE_CLIENT_SECRET}

  api-gateway:
    <<: *java-service
    build: { context: ., dockerfile: services/api-gateway/Dockerfile }
    image: grandvista/api-gateway:1.0.0
    depends_on:
      discovery-server: { condition: service_healthy }
      auth-service: { condition: service_healthy }
    environment:
      EUREKA_URL: http://${EUREKA_USERNAME}:${EUREKA_PASSWORD}@discovery-server:8761/eureka
      GV_JWKS_URI: http://auth-service:8081/oauth2/jwks
      GV_CORS_ALLOWED_ORIGINS: ${GV_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      GV_TRUST_FORWARDED_FOR: "true"
      GV_API_RATE_LIMIT: ${GV_API_RATE_LIMIT:-300}
      GV_AUTH_RATE_LIMIT: ${GV_AUTH_RATE_LIMIT:-10}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-true}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
    ports: ["${GATEWAY_HOST_PORT:-8080}:8080"]

  frontend:
    build: { context: ./frontend }
    image: grandvista/frontend:1.0.0
    restart: unless-stopped
    networks: [grandvista]
    depends_on:
      api-gateway: { condition: service_healthy }
    ports: ["${FRONTEND_HOST_PORT:-3000}:8080"]
    deploy: { resources: { limits: { memory: 64m } } }

networks:
  grandvista:
    name: grandvista

volumes:
  postgres-data:
    name: grandvista-postgres-data
  room-media:
    name: grandvista-room-media
