name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Unit, slice, contract and Testcontainers-backed integration tests (Docker is available on the runner).
      - name: Build and test all services
        run: mvn -B -ntp verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/*.xml'
          if-no-files-found: ignore

  frontend:
    name: Frontend lint, tests & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  images:
    name: Docker images & Compose validation
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Generate throw-away environment (random secrets, never published)
        run: ./scripts/init-env.sh
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build all images
        run: docker compose build

  dependency-audit:
    name: Dependency vulnerability audit (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: npm audit (high and critical)
        working-directory: frontend
        run: npm audit --audit-level=high --omit=dev
      - name: Dependency review (pull requests)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4

  # Deployment is intentionally disabled: no cloud account or registry credentials are configured.
  # See docs/deployment/DEPLOYMENT.md ("Cloud deployment") for the required secrets and steps.
  deploy:
    name: Deploy (disabled until configured)
    runs-on: ubuntu-latest
    needs: [images]
    if: ${{ false }}
    steps:
      - run: echo "Configure REGISTRY, credentials and a target platform before enabling this job."
