name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Explicit bash runs steps with "-eo pipefail", so "cmd | tee log" still fails the step when cmd fails.
defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build, tests & coverage
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Unit, slice, contract and Testcontainers integration tests (PostgreSQL, RabbitMQ, Mailpit run in Docker).
      # Any failing test fails the job.
      - name: Build and test all modules (with JaCoCo)
        run: mvn -B -ntp clean verify
      - name: Coverage summary
        if: always()
        run: ./scripts/coverage-summary.sh | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            **/target/surefire-reports/*.xml
            **/target/surefire-reports/*.txt
          if-no-files-found: ignore
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/target/site/jacoco-aggregate/
          if-no-files-found: ignore

  frontend:
    name: Frontend lint, tests & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: Docker images, full stack & end-to-end smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Generate throw-away environment (random secrets, never printed or published)
        run: ./scripts/init-env.sh
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build all images
        run: docker compose build
      - name: Start the stack (2 Eureka, 2 gateways + load balancer, 2 booking replicas, RabbitMQ, Mailpit, 5 databases)
        run: docker compose up -d --wait --wait-timeout 600
      - name: End-to-end smoke test (incl. e-mail checks)
        run: ./scripts/e2e-smoke.sh 2>&1 | tee e2e-smoke.log
      - name: Database isolation check
        run: ./scripts/verify-db-isolation.sh 2>&1 | tee db-isolation.log
      - name: Collect container status and logs
        if: always()
        run: |
          docker compose ps > compose-ps.log
          docker compose logs --no-color --timestamps > compose.log
      - name: Upload e2e logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            e2e-smoke.log
            db-isolation.log
            compose-ps.log
            compose.log
          if-no-files-found: ignore
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

  dependency-audit:
    name: Dependency vulnerability audit (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: npm audit (high and critical)
        working-directory: frontend
        run: npm audit --audit-level=high --omit=dev
      - name: Dependency review (pull requests)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4

  # Deployment is intentionally disabled: no cloud account or registry credentials are configured.
  # See docs/deployment/DEPLOYMENT.md ("Cloud deployment") for the required secrets and steps.
  deploy:
    name: Deploy (disabled until configured)
    runs-on: ubuntu-latest
    needs: [e2e]
    if: ${{ false }}
    steps:
      - run: echo "Configure the target VM and secrets before enabling this job (see DEPLOYMENT.md)."
