# Production overlay for a single VM:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build --wait
# (or ./scripts/deploy.sh). Only Caddy is published (80/443, automatic HTTPS for GV_DOMAIN); every other port —
# databases, RabbitMQ, Mailpit, Eureka, gateway, frontend — is reachable only inside the Docker network.
# Use an SSH tunnel for operator UIs, e.g. ssh -L 15672:localhost:15672 … after re-adding a loopback port.

x-prod-env: &prod-env
  SPRING_PROFILES_ACTIVE: prod

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    networks: [grandvista]
    depends_on:
      frontend: { condition: service_healthy }
      gateway-lb: { condition: service_healthy }
    environment:
      GV_DOMAIN: ${GV_DOMAIN:?set GV_DOMAIN in .env (your public host name)}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env (Let's Encrypt account e-mail)}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./infrastructure/docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    deploy: { resources: { limits: { memory: 128m } } }

  # ---- no host ports in production ----
  frontend: { ports: !reset [] }
  gateway-lb: { ports: !reset [] }
  discovery-server-1: { ports: !reset [] }
  discovery-server-2: { ports: !reset [] }
  auth-db: { ports: !reset [] }
  room-db: { ports: !reset [] }
  booking-db: { ports: !reset [] }
  payment-db: { ports: !reset [] }
  notification-db: { ports: !reset [] }
  rabbitmq: { ports: !reset [] }
  mailpit: { ports: !reset [] }

  # ---- prod profile: Swagger UI and API docs off; demo data only if GV_DEMO_SEED_ENABLED=true ----
  auth-service: { environment: { <<: *prod-env } }
  room-service: { environment: { <<: *prod-env } }
  booking-service: { environment: { <<: *prod-env } }
  payment-service: { environment: { <<: *prod-env } }
  notification-service:
    environment: { <<: *prod-env, GV_PUBLIC_WEB_URL: "https://${GV_DOMAIN}" }
  api-gateway-1:
    environment: { <<: *prod-env, GV_CORS_ALLOWED_ORIGINS: "https://${GV_DOMAIN}" }
  api-gateway-2:
    environment: { <<: *prod-env, GV_CORS_ALLOWED_ORIGINS: "https://${GV_DOMAIN}" }

volumes:
  caddy-data:
    name: grandvista-caddy-data
  caddy-config:
    name: grandvista-caddy-config
